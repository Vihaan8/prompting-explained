# All tunables for prompting-explained. Code reads these through core/config.py.

provider: anthropic
model: claude-haiku-5-5          # pinned; recorded in every AnalysisResult
# Claude Haiku 5.5 rejects non-default sampling parameters (400), so temperature
# is left unset (null = provider default). Set a number only for models that accept it.
temperature: null
thinking: disabled               # disabled | adaptive. Disabled keeps answers short and cheap.
effort: low                      # low | medium | high. Haiku 5.5 allows disabled thinking up to high.
max_tokens: 800                  # cap for task answers (400 truncated ~3% of answers in Phase 2)
segment_max_tokens: 2000         # cap for the segmentation call (it repeats the prompt)
explain_max_tokens: 120          # cap for "what changed" sentences
judge_parts: true                # per-part check: does each answer do what each part asked
judge_max_tokens: 600

baseline_runs: 3                 # full-prompt reruns to estimate noise
ablation_runs: 2                 # reruns per ablated prompt (1 gave false effects in Phase 2)
max_segments: 10
noise_floor_k: 2.0               # floor = max(k * std, min_floor)
min_noise_floor: 0.05
ablation_mode: delete            # delete | filler  (filler = replace with "[...]")
max_concurrency: 8
max_calls_per_analysis: 60       # hard budget; 1 + 3 + 10*2 runs + 23 judge + 3 explain = 50 at most
explain_top_n: 3                 # "what changed" one-liners for the top-N segments

# Used only to estimate cost in scripts and the README (USD per million tokens).
price_per_mtok:
  input: 0.10
  output: 0.50
