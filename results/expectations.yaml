# Expected verdicts, written by hand BEFORE running the tool on these prompts (2026-10-16).
# green = this part should matter (the answer gets worse at the task without it)
# grey  = it shouldn't matter (filler, redundant, or the AI does it anyway)
# red   = it should work against the task (the answer does better without it)
# Each prompt is given as its parts, in order; the tool is run with exactly these parts.

explain_to_kid:
  - parts:
      - [green, "Explain inflation to a 10-year-old."]
      - [green, "Use exactly 3 bullet points."]
      - [green, "Keep it under 60 words."]
  - parts:
      - [green, "Explain inflation"]
      - [green, "to a 10-year-old,"]
      - [grey, "please."]
      - [grey, "Thank you so much!"]
  - parts:
      - [green, "Explain inflation to a kid"]
      - [green, "in 3 bullet points."]
      - [red, "Use proper economics terms like CPI and monetary policy."]
  - parts:
      - [green, "Explain inflation to a 10-year-old in 3 bullets."]
      - [red, "Make it detailed, at least 150 words."]
  - parts:
      - [grey, "You are a friendly teacher."]
      - [green, "Explain why prices go up to a 10-year-old"]
      - [green, "in under 60 words,"]
      - [grey, "with a candy example."]
  - parts:
      - [green, "Explain inflation to a 10-year-old."]
      - [green, "Use exactly 3 short bullet points."]
      - [grey, "Use simple words."]
      - [grey, "Make sure a child could understand it."]
  - parts:
      - [grey, "Hi!"]
      - [green, "My cousin is 10 and wants to know why prices go up."]
      - [green, "Answer in 3 bullet points under 60 words."]
  - parts:
      - [green, "Explain inflation"]
      - [green, "in 3 bullet points"]
      - [red, "with a long introduction paragraph first."]

